homebridge:
  podOptions:
    hostNetwork: true

  ingress:
    main:
      enabled: true
      hosts:
        - host: homebridge.homelab.fouad.dev
      integrations:
        traefik:
          enabled: true

  persistence:
    config:
      enabled: false
    data:
      enabled: true
      type: pvc
      storageClass: linstor-replicated
      mountPath: /homebridge
      size: 1Gi
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
        argocd.argoproj.io/sync-options: Delete=false

  resources:
    requests:
      cpu: 75m
      memory: 200Mi
    limits:
      cpu: 1500m
      memory: 1024Mi
