maintainerr:
  ingress:
    main:
      enabled: true
      hosts:
        - host: maintainerr.homelab.fouad.dev

  persistence:
    data:
      type: pvc
      storageClass: linstor-replicated
      size: 500Mi
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
        argocd.argoproj.io/sync-options: Delete=false

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1024Mi
